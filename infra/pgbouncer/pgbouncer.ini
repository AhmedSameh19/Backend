[databases]
defaultdb = host=app-807a9868-54c1-4871-bfbd-504a8a4bba0a-do-user-244201-0.h.db.ondigitalocean.com port=25060 dbname=defaultdb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
reserve_pool_size = 0
reserve_pool_timeout = 5
ignore_startup_parameters = extra_float_digits
admin_users = doadmin
server_reset_query = DISCARD ALL
server_tls_sslmode = require
