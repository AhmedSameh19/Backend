[databases]
# Connection from PgBouncer to DO Postgres
defaultdb = host=app-807a9868-54c1-4871-bfbd-504a8a4bba0a-do-user-244201-0.h.db.ondigitalocean.com port=25060 dbname=defaultdb user=doadmin password=AVNS_tX4w6erHeU_O1e_pOE-

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

# Client authentication (API / Celery connect to PgBouncer)
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = doadmin

# Connection pooling
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 10
reserve_pool_size = 2
reserve_pool_timeout = 5

server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
