version: "3.9"

services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://doadmin:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://crm:crm@rabbitmq:5672//
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --workers 4
    ports:
      - "8002:8000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  celery_worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://doadmin:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://crm:crm@rabbitmq:5672//
    command: celery -A app.workers.celery_app.celery worker --loglevel=info
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  celery_beat:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://doadmin:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://crm:crm@rabbitmq:5672//
    command: celery -A app.workers.celery_app.celery beat --loglevel=info
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: crm
      RABBITMQ_DEFAULT_PASS: crm
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    environment:
      DB_HOST: app-807a9868-54c1-4871-bfbd-504a8a4bba0a-do-user-244201-0.h.db.ondigitalocean.com
      DB_PORT: 25060
      DB_NAME: ${DB_NAME}
      DB_USER: doadmin
      DB_PASSWORD: ${DB_PASSWORD}

      SERVER_TLS_SSLMODE: require
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      ADMIN_USERS: doadmin
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  redis_data:
  rabbitmq_data:
