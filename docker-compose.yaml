version: '3.9'

services:
  #   postgres:
  #     image: postgres:15
  #     container_name: crm_postgres
  #     environment:
  #       POSTGRES_USER: ${CRM_DB_USER:-crm}
  #       POSTGRES_PASSWORD: ${CRM_DB_PASSWORD:-crm}
  #       POSTGRES_DB: ${CRM_DB_NAME:-crm}
  #     ports:
  #       - "5432:5432"
  #     volumes:
  #       - crm_pgdata:/var/lib/postgresql/data
  #     restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    environment: [ "/usr/bin/pgbouncer", "/etc/pgbouncer/pgbouncer.ini" ]
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 5432" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    expose:
      - "8000"
    ports:
      - "8002:8000"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-4}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  celery_worker:
    build: .
    env_file:
      - .env
    command: celery -A app.workers.celery_app.celery worker --loglevel=info --concurrency=2
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  celery_beat:
    build: .
    env_file:
      - .env
    command: celery -A app.workers.celery_app.celery beat --loglevel=info
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-crm}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-crm}
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  # pgadmin:
  #   image: dpage/pgadmin4:8
  #   container_name: crm_pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - postgres
  #   restart: unless-stopped

volumes:
  redis_data:
  rabbitmq_data:
