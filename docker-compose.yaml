version: "3.9"
services:
  api:
    build: .
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+psycopg://doadmin:${DB_PASSWORD}@pgbouncer:6432/${DB_NAME}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    labels:
      - "coolify.managed=true"
      - "coolify.service=api"
      - "coolify.type=application"

  celery_worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://doadmin:${DB_PASSWORD}@pgbouncer:6432/${DB_NAME}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    command: celery -A app.workers.celery_app worker --loglevel=info
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    labels:
      - "coolify.managed=true"

  celery_beat:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://doadmin:${DB_PASSWORD}@pgbouncer:6432/${DB_NAME}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    labels:
      - "coolify.managed=true"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    labels:
      - "coolify.managed=true"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    labels:
      - "coolify.managed=true"
      
  pgbouncer:
    image: bitnami/pgbouncer:1.25.1
    environment:
      POSTGRESQL_HOST: ${DB_HOST}
      POSTGRESQL_PORT: ${DB_PORT:-25060}
      POSTGRESQL_USERNAME: ${DB_USER}
      POSTGRESQL_PASSWORD: ${DB_PASSWORD}
      POSTGRESQL_DATABASE: ${DB_NAME}
      PGBOUNCER_DATABASE: ${DB_NAME}
      PGBOUNCER_PORT: 6432
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 100
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
      PGBOUNCER_RESERVE_POOL_SIZE: 5
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/pgbouncer/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  rabbitmq_data:

