services:
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    ports:
      - "6432:5432"
    env_file:
      - .env.pgbouncer
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - pgbouncer
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-4}
    restart: unless-stopped
